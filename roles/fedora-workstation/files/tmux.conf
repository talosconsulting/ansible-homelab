# Terminal, true color, and nested tmux capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:extkeys:RGB'
set -as terminal-features 'tmux*:clipboard:ccolour:cstyle:focus:title:extkeys:RGB'

# Fast Esc response for agy / claude / vim without splitting SSH sequences
set -s escape-time 10

# Focus reporting and passthrough (notifications, OSC sequences, nested tmux)
set -g focus-events on
set -g allow-passthrough all

# Extended keys (Shift+Enter, etc.) for agy and claude
set -gw xterm-keys on
set -s extended-keys always
%if "#{m/r:^([4-9]|3\.[5-9]|3\.[1-9][0-9]),#{version}}"
set -s extended-keys-format csi-u
%endif

# Copy/paste: keep native terminal selection & middle-click paste working,
# and allow OSC 52 clipboard updates from inner apps and copy-mode
set -g mouse off
set -s set-clipboard on
bind m set -g mouse \; display-message "Mouse #{?mouse,on,off}"

# Larger scrollback for agent output
set -g history-limit 50000

# Show hostname in status bar (helpful when connected from zeus to apollo)
set -g status-left "[#h:#{session_name}] "
set -g status-left-length 30

# Nested tmux support (e.g. zeus -> ssh apollo -> tmux):
# Press F12 to pass all keys (including C-b) through to the inner session;
# press F12 again to restore outer tmux control.
bind -T root F12 \
  set prefix None \; \
  set key-table off \; \
  set status-style "bg=colour238,fg=colour246" \; \
  set status-left "[#h:#{session_name} OFF] " \; \
  refresh-client -S

bind -T off F12 \
  set -u prefix \; \
  set -u key-table \; \
  set -u status-style \; \
  set -u status-left \; \
  refresh-client -S
